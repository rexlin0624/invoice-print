name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 网页版：产出可静态托管的 dist，附到 Release 上。
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager（pnpm@12.3.4）。
      # 不要在这里再写 `version:` —— action 要求两者精确相等，否则报
      # "Multiple versions of pnpm specified"（12 ≠ 12.3.4）。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # OCR 的运行时 + 中文模型（23 MB）不在版本库里（public/ocr 已 gitignore），
      # 所以发布之前必须备一次 —— 不备的话网页包会从 37 MB 缩到 3.6 MB：
      # 「拖进扫描件/图片发票」这条主功能在发布包里直接不可用。
      - name: 准备离线 OCR 资源
        run: pnpm ocr:prepare

      - run: pnpm build

      - name: 打包
        run: |
          cd apps/web/dist
          zip -qr "$GITHUB_WORKSPACE/invoice-tool_${GITHUB_REF_NAME#v}_web.zip" .

      # 附件名里的非 ASCII 会被 GitHub 剥掉：中文产品名会消失，`发票工具_0.1.0_x64.dmg`
      # 会变成 `_0.1.0_x64.dmg`。桌面端现在统一用 ASCII 命名（见 desktop 作业的
      # assetNamePattern），这里顺手把老名字清掉 —— 第二次之后再跑就是空操作。
      # 不清的话，tauri-action 按「算出来的名字」去找同名附件（找不到）→ 直接传 →
      # already_exists，整个作业失败。
      # `*_linux_*` 也在清理范围内：Linux 已不在支持范围（AGENTS.md §7），
      # 这条规则只为把 v0.1.0 那次留下的 deb / AppImage 从发布页上撤掉，之后不再命中。
      - name: 清理陈旧命名的附件
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -E '^_|^invoice-tool-web-|_linux_' \
            | while read -r name; do
                echo "删除陈旧附件：$name"
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
              done || true

      - uses: softprops/action-gh-release@v3
        with:
          files: invoice-tool_*_web.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # 桌面端：M4 起启用。
  #
  # 为什么发布包默认在这里构建：本机是 8 GB 内存的 MacBook Air，
  # `cargo build --release` 的完整 codegen + 单进程链接实测峰值 1178 MB（2026-10-18），
  # 本机跑得动 —— 但那几分钟里没人踩刹车，而 CI 不占本机内存（AGENTS.md §1）。
  # Tauri 的桌面端产物默认在这里出。
  #
  # 前端产物由 `apps/desktop/src-tauri/tauri.conf.json` 的 `beforeBuildCommand`
  # 负责生成（`pnpm --filter @invoice-tool/web build`）—— 桌面端没有自己的界面代码。
  # 平台范围：Windows + macOS 两个架构（Linux 已出局，AGENTS.md §7）。
  # ---------------------------------------------------------------------------
  desktop:
    # 等 web 先把 Release 建出来：web 用 softprops/action-gh-release、desktop 用
    # tauri-action，两者都会「不存在就创建」。同时跑会在首次发布时撞车
    # （already_exists）。串起来之后 tauri-action 只需往已有 Release 传附件。
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # maxmem 是给 rust.mjs 看门狗的上限（RUST_MAX_MEMORY_MB）。本机默认 2500 MB 是
          # 按 8 GB 笔记本定的（AGENTS.md §1）；CI runner 内存大得多，沿用 2500 会把
          # 链接阶段误杀。只放宽上限，不撤看门狗（跑飞了仍然会刹）。
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            targets: 'aarch64-apple-darwin'
            maxmem: 4000
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            targets: 'x86_64-apple-darwin'
            maxmem: 4000
          # Linux 不在支持范围（AGENTS.md §7）：rpm 打包器拒绝中文包名，deb / AppImage
          # 换不来用户群 —— 别再往这个矩阵里加 ubuntu 条目。CI 的 ubuntu 作业只负责
          # 跑 cargo test（ci.yml），与发布无关。
          # Windows 只要 NSIS 的 `-setup.exe`，不要 msi
          # （`bundle.targets` 是 "all"，这里按平台收窄）。
          - platform: windows-latest
            args: '--bundles nsis'
            targets: ''
            maxmem: 8000
    runs-on: ${{ matrix.platform }}
    env:
      RUST_MAX_MEMORY_MB: ${{ matrix.maxmem }}
    steps:
      - uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager（pnpm@12.3.4）。
      # 不要在这里再写 `version:` —— action 要求两者精确相等，否则报
      # "Multiple versions of pnpm specified"（12 ≠ 12.3.4）。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 交叉编译目标
        # tauri-action 不管装 target（它只负责打包与上传），而 arm64 的 macOS runner
        # 上编 x86_64（或反过来）必须先 `rustup target add`，否则报「target may not be installed」。
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}

      - run: pnpm install --frozen-lockfile

      # 发布包要能识别扫描件/图片发票：OCR 运行时与中文模型不在版本库里，
      # 得在打包前备好（见 web 作业里那一步的说明）。
      - name: 准备离线 OCR 资源
        run: pnpm ocr:prepare

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # 必须写死，不能让 action 自己猜：它按锁文件位置判断包管理器，而我们的
          # pnpm-lock.yaml 在仓库根、projectPath 是 apps/desktop —— 第一次跑就被猜成了
          # npm，于是执行 `npm run tauri build …`，而 npm 会在参数前插一个 `--`
          # （pnpm 会把那个 `--` 原样传进脚本，tauri 的 clap 会把 --target 当位置参数）。
          # `pnpm tauri …` 走的是 apps/desktop 的 `tauri` 脚本 → rust.mjs 那道闸。
          tauriScript: pnpm tauri
          # 附件名必须自己给：中文产品名 `发票工具` 传到 GitHub 会被剥掉，
          # `发票工具_0.1.0_x64-setup.exe` 变成 `_0.1.0_x64-setup.exe`；更要命的是
          # 上传前它按「算出来的原名」找同名附件来决定先删后传 —— 名字对不上就
          # 变成重传，第二次跑必然 `already_exists` 而整个作业失败。
          assetNamePattern: 'invoice-tool_[version]_[platform]_[arch][setup][ext]'
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          args: ${{ matrix.args }}
