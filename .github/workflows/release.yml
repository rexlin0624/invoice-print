name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 网页版：产出可静态托管的 dist，附到 Release 上。
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager（pnpm@12.3.4）。
      # 不要在这里再写 `version:` —— action 要求两者精确相等，否则报
      # "Multiple versions of pnpm specified"（12 ≠ 12.3.4）。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: 打包
        run: cd apps/web/dist && zip -r "$GITHUB_WORKSPACE/invoice-tool-web-${{ github.ref_name }}.zip" .

      - uses: softprops/action-gh-release@v3
        with:
          files: invoice-tool-web-*.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # 桌面端：M4 起启用。
  #
  # 为什么发布包默认在这里构建：本机是 8 GB 内存的 MacBook Air，
  # `cargo build --release` 的完整 codegen + 单进程链接实测峰值 1178 MB（2026-10-18），
  # 本机跑得动 —— 但那几分钟里没人踩刹车，而 CI 不占本机内存（AGENTS.md §1）。
  # Tauri 的三平台产物默认在这里出。
  #
  # 前端产物由 `apps/desktop/src-tauri/tauri.conf.json` 的 `beforeBuildCommand`
  # 负责生成（`pnpm --filter @invoice-tool/web build`）—— 桌面端没有自己的界面代码。
  # ---------------------------------------------------------------------------
  desktop:
    # 等 web 先把 Release 建出来：web 用 softprops/action-gh-release、desktop 用
    # tauri-action，两者都会「不存在就创建」。同时跑会在首次发布时撞车
    # （already_exists）。串起来之后 tauri-action 只需往已有 Release 传附件。
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # maxmem 是给 rust.mjs 看门狗的上限（RUST_MAX_MEMORY_MB）。本机默认 2500 MB 是
          # 按 8 GB 笔记本定的（AGENTS.md §1）；CI runner 内存大得多，而且 Linux 的 GNU ld
          # 做 thin-LTO 链接比 macOS 的 ld64 吃内存 —— 沿用 2500 会把链接阶段误杀。
          # 只放宽上限，不撤看门狗（跑飞了仍然会刹）。
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            targets: 'aarch64-apple-darwin'
            maxmem: 4000
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            targets: 'x86_64-apple-darwin'
            maxmem: 4000
          - platform: ubuntu-22.04
            args: ''
            targets: ''
            maxmem: 8000
          # Windows 只要 NSIS 的 `-setup.exe`，不要 msi
          # （`bundle.targets` 是 "all"，这里按平台收窄）。
          - platform: windows-latest
            args: '--bundles nsis'
            targets: ''
            maxmem: 8000
    runs-on: ${{ matrix.platform }}
    env:
      RUST_MAX_MEMORY_MB: ${{ matrix.maxmem }}
    steps:
      - uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager（pnpm@12.3.4）。
      # 不要在这里再写 `version:` —— action 要求两者精确相等，否则报
      # "Multiple versions of pnpm specified"（12 ≠ 12.3.4）。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: 交叉编译目标
        # tauri-action 不管装 target（它只负责打包与上传），而 arm64 的 macOS runner
        # 上编 x86_64（或反过来）必须先 `rustup target add`，否则报「target may not be installed」。
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}

      - name: Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # 必须写死，不能让 action 自己猜：它按锁文件位置判断包管理器，而我们的
          # pnpm-lock.yaml 在仓库根、projectPath 是 apps/desktop —— 第一次跑就被猜成了
          # npm，于是执行 `npm run tauri build …`，而 npm 会在参数前插一个 `--`
          # （pnpm 会把那个 `--` 原样传进脚本，tauri 的 clap 会把 --target 当位置参数）。
          # `pnpm tauri …` 走的是 apps/desktop 的 `tauri` 脚本 → rust.mjs 那道闸。
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          args: ${{ matrix.args }}
