name: Pages

# 把网页版部署到 GitHub Pages，地址形如：
#   https://<owner>.github.io/invoice-print/
#
# 首次使用前，仓库 Settings → Pages → Build and deployment → Source
# 选 **GitHub Actions**（只需点一次；GITHUB_TOKEN 没有权限替仓库开启 Pages）。
#
# 为什么不复用 release.yml 的 web.zip：那份是给「下载后自己托管」的离线包，
# 这里要的是 Pages 的 artifact 格式（根目录直接是 index.html），两者不能混。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署不能中途取消：新任务排队，旧的跑完再上，避免线上出现半套产物
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 版本取自 package.json 的 packageManager（pnpm@12.3.4）。
      # 不要在这里再写 `version:` —— action 要求两者精确相等。
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 网页版发布包必须自带 OCR：public/ocr/ 是 gitignore 的（模型约 23 MB），
      # 不备这一步，「拖进扫描件/图片发票」在线上直接不可用。
      - name: 准备离线 OCR 资源
        run: pnpm ocr:prepare

      # build 里已经包含 tsc --noEmit、vite build 与 check-build（CSP / 产物白名单）
      - name: 构建网页版
        run: pnpm build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
